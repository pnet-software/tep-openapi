# OpenAPI 3.0, like the 3GPP files it references: in a 3.1 document, swagger-parser (and so
# openapi-generator) inlines external references, and the 3GPP models lose their names.
openapi: 3.0.3
info:
  title: Telco Exposure & Programmability (TEP) API
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    email: jmikros@p-net.gr
    url: https://github.com/pnet-software/tep-openapi
  description: |
    The Telco Exposure & Programmability (TEP) API exposes a 5G core network to the
    applications that run on it: its subscribers and what the core knows of them right
    now, the quality levels it offers, and where subscribers are in the network. Each
    5G core has its own element manager serving this API, so an application works the
    same whatever the core behind it.

    ## What it offers

    - **Subscribers**: provision subscribers (identity, credentials and the data
      networks they may use), and read what the core currently knows of each: its
      real-time status, the cell it is in, and its latest SIM and device swap.
    - **Quality Profiles**: the quality (QoS) levels the core offers. Read-only.
    - **Cells**: the radio cells of the network and their coverage areas.
    - **AS sessions with QoS**: the 3GPP AsSessionWithQoS API, for an application
      server to give a UE's traffic one of the quality profiles.

    ## Before you start

    Part of what this API answers comes from the deployment's configuration and from
    data you register through it.

    1. **Quality profiles** are configured with the deployment, not created through the
       API. Each has a `name` and a `fiveQi`, the 5QI that realizes it, and the core's
       policy control must map every profile name to that 5QI. Changing them takes a
       restart of both.
    2. **Subscribers** are provisioned with `POST /subscriber`: IMSI, phone number,
       credentials, and the data networks they may use, each a DNN in a slice.
    3. **Cells** are registered with `POST /cell`: PLMN, NCI, and coverage area (a
       centre and a radius). `POST /subscriber/location` answers with the cell
       the core reports the UE in, and with that cell's coverage area once it is
       registered. Cells can be added at any time, for example when a new gNB
       connects: the location of a UE in one of its cells gives the cell id to
       register.
    4. **SIM and device swaps** are recorded by a component that watches the core's
       subscribers. Without it, `POST /subscriber/swaps` has nothing to answer.

    ## AS sessions with QoS (3GPP TS 29.122)

    TEP carries the 3GPP **AsSessionWithQoS** API (T8 reference point), so an
    application server requests QoS through the same entrypoint as everything else.
    Its operations are mounted under `/3gpp-as-session-with-qos/v1`, and defined by the
    3GPP spec next to this one, which they reference unchanged.

    - `qosReference` names the quality profile to apply. It must be `ACTIVE`.
    - `ueIpv4Addr` identifies the UE: the core finds its PDU session by it, so the UE
      must be connected.
    - `flowInfo` describes the traffic the QoS applies to, as IP filter rules.
    - When the network ends a session, the application server is notified at
      `{notificationDestination}/notifications`.
    - A session is changed with a PATCH (JSON merge patch) of its `qosReference`,
      `flowInfo` or `notificationDestination`; any other field is rejected. Replacing a
      session with a PUT isn't supported.

    Before asking the core, the deployment gives the UE's PDU session what the core
    needs to authorize the profile.

    ## Conventions

    - **Base URL**: every path is relative to `{apiRoot}/tep-api/v1`, where `apiRoot`
      is the deployment's scheme, host and port.
    - **Paging**: list operations take `limit` (1 to 500, default 50) and `offset`
      (default 0), and answer with the page's `items` and the `total`.
    - **Correlation**: every operation takes an optional `x-correlator` header, as
      CAMARA APIs do. A response carries it back, errors included, and the server logs
      the request under it. The 3GPP AsSessionWithQoS operations take it too, although
      their spec doesn't list it.
    - **Errors**: every error is an RFC 9457 problem (`application/problem+json`) with
      a `title`, `status` and `detail`. A 400 caused by one field can name it in a
      3GPP `invalidParams` entry.
    - **No phone numbers in URLs**: proxies, gateways and servers routinely log URLs,
      so no path or query carries a subscriber's phone number or IMSI. Operations
      that look a subscriber up by its phone number take it in the request body, as a
      `TepDevice`, the way CAMARA APIs take a `device`.
    - **Subscriber id**: the `id` in `/subscriber/{id}` is an opaque string the
      element manager assigns when the subscriber is created. It stays the same for
      the subscriber's lifetime, through SIM swaps and number changes. Get it from the
      `Location` of `POST /subscriber`, from `GET /subscriber`, or from a phone number
      with `POST /subscriber/retrieve`.

    ## Trust model

    This API is intended to run as a **trusted internal service** behind
    network-level access control. It provides **no authentication** and returns
    subscriber credentials (K, OPc) and identifiers (IMSI, MSISDN) in plaintext.
    **Do not expose it publicly.**
externalDocs:
  description: Project repository and README
  url: https://github.com/pnet-software/tep-openapi
servers:
- url: "{apiRoot}/tep-api/v1"
  description: TEP deployment
  variables:
    apiRoot:
      # Empty: the server URL is relative, so Swagger UI calls the API wherever the spec was loaded from
      default: ""
      description: |
        Scheme, host and port of your TEP deployment, e.g. https://tep.example.com. Empty
        by default: the server URL is then relative to where this spec was loaded from.
tags:
- name: Subscribers
  description: |
    The subscribers of the 5G core. Provision them (list, create, read, update and
    delete them, including SIM swaps and number changes), and read what the core
    currently knows of each: its real-time status, the cell it is in, and its latest
    SIM and device swap.
- name: Quality Profiles
  description: |
    The quality (QoS) profiles the 5G core offers, which an AS session with QoS names
    in its `qosReference`. Read-only: profiles are part of the deployment's
    configuration.
- name: Cells
  description: |
    The radio cells of the network and their coverage areas, which a subscriber's
    location is answered from.
- name: AS Session with Required QoS Subscriptions
  description: |
    3GPP TS 29.122 AsSessionWithQoS: create the QoS sessions of an SCS/AS, and list
    them.
- name: Individual AS Session with Required QoS Subscription
  description: |
    3GPP TS 29.122 AsSessionWithQoS: read, change and end one QoS session.
paths:
  /subscriber/{id}:
    parameters:
    - $ref: "#/components/parameters/SubscriberId"
    - $ref: "#/components/parameters/XCorrelator"
    get:
      tags:
      - Subscribers
      summary: Get subscriber by id
      description: Retrieves a subscriber with the provided id
      operationId: getSubscriber
      responses:
        "200":
          description: Successfully retrieved subscriber details
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepSubscriber"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid subscriber ID format
        "404":
          $ref: "#/components/responses/NotFound"
          description: Subscriber not found
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
      - Subscribers
      summary: Update a subscriber by id
      description: |
        Updates the subscriber with the provided id. The body's IMSI and phone number
        may differ from the subscriber's current ones: a different IMSI is a SIM swap,
        and a different phone number a number change. Either way the subscriber keeps
        its id. An `id` in the body is ignored.
      operationId: updateSubscriber
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TepSubscriber"
        required: true
      responses:
        "204":
          description: Successfully updated subscriber
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Invalid or missing request body, invalid subscriber ID format"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Subscriber not found
        "409":
          $ref: "#/components/responses/Conflict"
          description: Another subscriber already has the IMSI or phone number
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
      - Subscribers
      summary: Delete a subscriber by id
      description: Deletes a subscriber with the provided id
      operationId: deleteSubscriber
      responses:
        "204":
          description: Successfully deleted subscriber
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid subscriber ID format
        "404":
          $ref: "#/components/responses/NotFound"
          description: Subscriber not found
        "500":
          $ref: "#/components/responses/InternalError"
  /quality-profile/{name}:
    parameters:
    - $ref: "#/components/parameters/QualityProfileName"
    - $ref: "#/components/parameters/XCorrelator"
    get:
      tags:
      - Quality Profiles
      summary: Get quality profile by name
      description: Get the quality profile information using its name
      operationId: getQualityProfile
      responses:
        "200":
          description: Successfully retrieved quality profile details
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepQualityProfile"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Quality profile not found
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriber:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    get:
      tags:
      - Subscribers
      summary: List subscriber refs
      description: Retrieves a page of subscriber refs in the 5G core network
      operationId: listSubscribers
      parameters:
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Successfully retrieved a page of subscriber refs
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepSubscriberRefPage"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid pagination parameters
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
      - Subscribers
      summary: Add new subscriber
      description: Adds a new subscriber in the 5G core
      operationId: createSubscriber
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TepSubscriber"
        required: true
      responses:
        "201":
          description: Successfully added new subscriber
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
            Location:
              description: URL of the created subscriber
              schema:
                type: string
                format: uri
              example: /tep-api/v1/subscriber/6731f0c2a4b5c6d7e8f90123
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid or missing request body
        "409":
          $ref: "#/components/responses/Conflict"
          description: Subscriber already exists
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /quality-profile:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    get:
      tags:
      - Quality Profiles
      summary: Get all quality profiles
      description: Retrieves a page of quality profiles in the 5G core
      operationId: listQualityProfiles
      parameters:
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Successfully retrieved a page of quality profiles
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepQualityProfilePage"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid pagination parameters
        "500":
          $ref: "#/components/responses/InternalError"
  /cell:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    get:
      tags:
      - Cells
      summary: Get all cells
      description: Retrieves a page of cells in the 5G network
      operationId: listCells
      parameters:
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Successfully retrieved a page of cells
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepCellPage"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid pagination parameters
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
      - Cells
      summary: Add new cell
      description: Adds a new cell
      operationId: createCell
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TepCell"
        required: true
      responses:
        "201":
          description: Successfully added new cell
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
            Location:
              description: URL of the created cell
              schema:
                type: string
                format: uri
              example: /tep-api/v1/cell/99950-000000210
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid or missing request body
        "409":
          $ref: "#/components/responses/Conflict"
          description: Cell already exists
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriber/retrieve:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    post:
      tags:
      - Subscribers
      summary: Get a subscriber by phone number
      description: |
        Retrieves the subscriber with the phone number of the device in the body,
        including its `id`.
      operationId: retrieveSubscriber
      requestBody:
        $ref: "#/components/requestBodies/Device"
      responses:
        "200":
          description: Successfully retrieved subscriber details
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepSubscriber"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Invalid or missing request body, invalid phone number"
        "404":
          $ref: "#/components/responses/NotFound"
          description: No subscriber has the phone number
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriber/status:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    post:
      tags:
      - Subscribers
      summary: Get the real-time status of a subscriber by phone number
      description: |
        Informs about the real-time status of the subscriber with the phone number of
        the device in the body.
      operationId: getSubscriberStatus
      requestBody:
        $ref: "#/components/requestBodies/Device"
      responses:
        "200":
          description: Successfully retrieved subscriber status
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepSubscriberStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Invalid or missing request body, invalid phone number"
        "404":
          $ref: "#/components/responses/NotFound"
          description: No subscriber has the phone number
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriber/location:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    post:
      tags:
      - Subscribers
      summary: Get where a subscriber is by phone number
      description: |
        Informs about where the UE of the subscriber with the phone number of the
        device in the body last reported from, as the 5G core currently sees it: the
        cell it is in, and that cell's coverage area if the cell is registered with
        TEP.
      operationId: getSubscriberLocation
      requestBody:
        $ref: "#/components/requestBodies/Device"
      responses:
        "200":
          description: Successfully retrieved the subscriber's location
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepSubscriberLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Invalid or missing request body, invalid phone number"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No subscriber has the phone number, or it isn't registered in an NR cell"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriber/swaps:
    parameters:
    - $ref: "#/components/parameters/XCorrelator"
    post:
      tags:
      - Subscribers
      summary: Get the latest SIM and device swap of a subscriber by phone number
      description: |
        Informs about the current SIM (IMSI) and device (IMEISV) of the subscriber
        with the phone number of the device in the body, and when each last changed:
        its latest SIM swap and device swap. A SIM swap changes the IMSI but keeps the
        phone number, which is why the subscriber is looked up by it.
      operationId: getSwaps
      requestBody:
        $ref: "#/components/requestBodies/Device"
      responses:
        "200":
          description: Successfully retrieved the subscriber's swaps
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepSwaps"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Invalid or missing request body, invalid phone number"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            No subscriber has the phone number, or nothing is recorded on its swaps. The
            second means that whether it swapped is unknown, not that it never did.
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /cell/{id}:
    parameters:
    - $ref: "#/components/parameters/CellId"
    - $ref: "#/components/parameters/XCorrelator"
    get:
      tags:
      - Cells
      summary: Get cell by id
      description: Get the cell information using its id
      operationId: getCell
      responses:
        "200":
          description: Successfully retrieved cell details
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TepCell"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Cell not found
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
      - Cells
      summary: Update a cell by id
      description: Updates a cell with the provided id
      operationId: updateCell
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TepCell"
        required: true
      responses:
        "204":
          description: Successfully updated cell
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Invalid or missing request body, invalid id format"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Cell not found
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
      - Cells
      summary: Delete a cell by id
      description: Deletes a cell with the provided id
      operationId: deleteCell
      responses:
        "204":
          description: Successfully deleted cell
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid id format
        "404":
          $ref: "#/components/responses/NotFound"
          description: Cell not found
        "500":
          $ref: "#/components/responses/InternalError"
  # The 3GPP AsSessionWithQoS API, mounted under the TEP base path. Each path item is taken
  # unchanged from TS29122_AsSessionWithQoS_Bundle.openapi.yaml: the 3GPP spec with the components it uses
  # from the other 3GPP files copied in, so all its references are local. Swagger UI resolves
  # references that chain through several files unreliably: a local reference can be looked up in
  # the wrong file. The braces are percent-encoded: a URI fragment may not contain them literally.
  /3gpp-as-session-with-qos/v1/{scsAsId}/subscriptions:
    $ref: "TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/paths/~1%7BscsAsId%7D~1subscriptions"
  /3gpp-as-session-with-qos/v1/{scsAsId}/subscriptions/{subscriptionId}:
    $ref: "TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/paths/~1%7BscsAsId%7D~1subscriptions~1%7BsubscriptionId%7D"
components:
  parameters:
    SubscriberId:
      name: id
      in: path
      required: true
      description: |
        Subscriber id (`id`): an opaque string the element manager assigned when the
        subscriber was created, stable for its lifetime. Never a phone number or IMSI.
      schema:
        type: string
      example: 6731f0c2a4b5c6d7e8f90123
    QualityProfileName:
      name: name
      in: path
      required: true
      description: Unique name of the quality profile
      schema:
        type: string
        minLength: 3
        maxLength: 256
        pattern: "^[a-zA-Z0-9_.-]+$"
    CellId:
      name: id
      in: path
      required: true
      description: Cell id (`id`), its NR Cell Global Identity.
      schema:
        type: string
      example: "99950-000000210"
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: |
        Correlation id of the request, which the response carries back and the
        server logs it under. Without one, the server makes one up for its logs.
      schema:
        $ref: "#/components/schemas/XCorrelator"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in one page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before starting to collect the page.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
  headers:
    XCorrelator:
      description: The request's correlation id, when it sent one
      schema:
        $ref: "#/components/schemas/XCorrelator"
  requestBodies:
    Device:
      description: The device of the subscriber to look up
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TepDevice"
  responses:
    BadRequest:
      description: Invalid request
      headers:
        x-correlator:
          $ref: "#/components/headers/XCorrelator"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      headers:
        x-correlator:
          $ref: "#/components/headers/XCorrelator"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Resource already exists
      headers:
        x-correlator:
          $ref: "#/components/headers/XCorrelator"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Invalid media type
      headers:
        x-correlator:
          $ref: "#/components/headers/XCorrelator"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Server-side processing error
      headers:
        x-correlator:
          $ref: "#/components/headers/XCorrelator"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    XCorrelator:
      type: string
      description: A correlation id, as in CAMARA APIs
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    PageInfo:
      type: object
      description: Pagination metadata shared by all paged list responses.
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of items available across all pages
          example: 1234
        limit:
          type: integer
          format: int32
          description: The page size that was applied
          example: 50
        offset:
          type: integer
          format: int32
          description: The offset that was applied
          example: 0
      required:
      - total
      - limit
      - offset
    TepSubscriberRefPage:
      description: A page of subscriber refs
      allOf:
      - $ref: "#/components/schemas/PageInfo"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/TepSubscriberRef"
        required:
        - items
    TepQualityProfilePage:
      description: A page of quality profiles
      allOf:
      - $ref: "#/components/schemas/PageInfo"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/TepQualityProfile"
        required:
        - items
    TepCellPage:
      description: A page of cells
      allOf:
      - $ref: "#/components/schemas/PageInfo"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/TepCell"
        required:
        - items
    Extension:
      type: object
      description: |
        Optional key/value extensions. They exist only for differences between the 5G
        cores whose element managers implement TEP: what one core needs beyond the TEP
        model can go here. TEP itself defines no keys, and a client that doesn't know an
        implementation's keys can leave them out.
        Values can be strings, numbers, booleans, lists or objects. An implementation
        documents the keys it uses in its own README.
      additionalProperties: true
      example:
        key1: value1
        key2: value2
    TepDevice:
      type: object
      description: |
        The device of a subscriber, which an operation looks the subscriber up by. It
        is sent in the request body, never in the URL, as CAMARA APIs send a `device`.
      properties:
        phoneNumber:
          type: string
          description: |
            Phone number (MSISDN) of the subscriber. Whether a leading `+` is required
            is implementation-defined.
          example: "+306999999999"
      required:
      - phoneNumber
    TepSubscriber:
      type: object
      description: TEP Subscriber Object
      properties:
        id:
          type: string
          readOnly: true
          description: |
            Subscriber id, and its id in the API path: assigned by the element manager
            when the subscriber is created, and stable through SIM swaps and number
            changes. Opaque: never parse it.
          example: 6731f0c2a4b5c6d7e8f90123
        imsi:
          type: string
          description: International Mobile Subscriber Identity of the subscriber's SIM card
          example: "123456789012345"
        phoneNumber:
          type: string
          description: Phone number associated with the subscriber
          example: "+306999999999"
        authenticationManagementField:
          type: string
          description: Authentication Management Field value for key derivation
          example: "8000"
        permanentKeyValue:
          type: string
          description: Permanent key value (K) used for authentication. Returned in plaintext; see API description for the trust model.
          example: 0123456789ABCDEF0123456789ABCDEF
        opcValue:
          type: string
          description: Operator variant algorithm configuration field (OPc). Returned in plaintext; see API description for the trust model.
          example: 0123456789ABCDEF0123456789ABCDEF
        dataNetworks:
          type: array
          description: The data networks the subscriber may use, each in a network slice
          items:
            $ref: "#/components/schemas/TepSubscriberDataNetwork"
        extensions:
          $ref: "#/components/schemas/Extension"
          description: |
            Optional, and only for what a particular core's implementation needs beyond
            the TEP subscriber model
      required:
      - authenticationManagementField
      - dataNetworks
      - imsi
      - opcValue
      - permanentKeyValue
      - phoneNumber
    TepSubscriberDataNetwork:
      type: object
      description: A data network a subscriber may use, and the network slice it is in
      properties:
        dnn:
          type: string
          description: Data Network Name
          example: internet
        sst:
          type: string
          description: Slice Service Type
          example: "1"
        sd:
          type: string
          description: Slice Differentiator
          example: "000001"
      required:
      - dnn
      - sst
    Problem:
      type: object
      description: |
        Error details as defined by RFC 9457 (Problem Details for HTTP APIs),
        returned with media type `application/problem+json`. Additional
        extension members may be present.
      externalDocs:
        description: RFC 9457
        url: https://www.rfc-editor.org/rfc/rfc9457
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type. Defaults to `about:blank` when omitted.
          default: about:blank
          example: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the server for this occurrence
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: Subscriber 6731f0c2a4b5c6d7e8f90123 not found
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence
          example: /tep-api/v1/subscriber/6731f0c2a4b5c6d7e8f90123
      required:
      - title
      - status
      additionalProperties: true
    TepQualityProfile:
      type: object
      description: A quality (QoS) profile offered by the 5G core
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 3
          pattern: "^[a-zA-Z0-9_.-]+$"
          description: Unique name of the profile
          example: premium-video
        description:
          type: string
          description: Human-readable description of the profile
          example: Low-latency, high-throughput profile for video streaming
        status:
          type: string
          description: Lifecycle state of the profile
          enum:
          - ACTIVE
          - INACTIVE
          - DEPRECATED
          example: ACTIVE
        targetMinUpstreamRate:
          $ref: "#/components/schemas/TepQualityProfileRate"
          description: Minimum target upstream bit rate
        maxUpstreamRate:
          $ref: "#/components/schemas/TepQualityProfileRate"
          description: Maximum allowed upstream bit rate
        targetMinDownstreamRate:
          $ref: "#/components/schemas/TepQualityProfileRate"
          description: Minimum target downstream bit rate
        maxDownstreamRate:
          $ref: "#/components/schemas/TepQualityProfileRate"
          description: Maximum allowed downstream bit rate
        minDuration:
          $ref: "#/components/schemas/TepQualityProfileDuration"
          description: Minimum session duration for this profile
        maxDuration:
          $ref: "#/components/schemas/TepQualityProfileDuration"
          description: Maximum session duration for this profile
        priority:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
          description: Priority of the profile; a lower value means a higher priority
          example: 20
        packetDelayBudget:
          $ref: "#/components/schemas/TepQualityProfileDuration"
          description: Maximum one-way latency between the UE and the UPF
        jitter:
          $ref: "#/components/schemas/TepQualityProfileDuration"
          description: Maximum allowed variation in packet delay
        packetErrorLossRate:
          type: integer
          format: int32
          maximum: 10
          minimum: 1
          description: |
            Exponent N of the maximum packet loss rate, expressed as 10^-N
            (e.g. 3 means a loss rate of at most 10^-3).
          example: 3
        fiveQi:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          description: |
            5QI that realizes the profile in the 5G core: the core's policy control maps
            the profile's name to it, and gives an AS session with QoS that names the
            profile a QoS flow with it.
          example: 2
        preemptionCapability:
          type: string
          description: |
            Whether a QoS flow with this profile may pre-empt others: the ARP
            pre-emption capability (3GPP TS 29.571)
          enum:
          - MAY_PREEMPT
          - NOT_PREEMPT
          example: NOT_PREEMPT
        preemptionVulnerability:
          type: string
          description: |
            Whether others may pre-empt a QoS flow with this profile: the ARP
            pre-emption vulnerability (3GPP TS 29.571)
          enum:
          - PREEMPTABLE
          - NOT_PREEMPTABLE
          example: PREEMPTABLE
      required:
      - name
      - status
    TepQualityProfileDuration:
      type: object
      description: A duration expressed as a value and a time unit
      properties:
        value:
          type: integer
          format: int32
          minimum: 1
          description: Duration value, in the given unit
          example: 10
        unit:
          type: string
          description: Time unit of the value
          example: MILLISECONDS
          enum:
          - DAYS
          - HOURS
          - MINUTES
          - SECONDS
          - MILLISECONDS
          - MICROSECONDS
          - NANOSECONDS
      required:
      - value
      - unit
    TepQualityProfileRate:
      type: object
      description: A bit rate expressed as a value and a unit
      properties:
        value:
          type: integer
          format: int32
          maximum: 1024
          minimum: 0
          description: Bit rate value, in the given unit
          example: 10
        unit:
          type: string
          description: |
            Unit of the bit rate (bits per second and multiples), written as in a
            3GPP BitRate (TS 29.571)
          example: Mbps
          enum:
          - bps
          - Kbps
          - Mbps
          - Gbps
          - Tbps
      required:
      - value
      - unit
    TepCell:
      type: object
      description: |
        An NR radio cell and its coverage area: a circle around `center` of the given `radius`.
        The cell is identified by its PLMN and its 36-bit NR Cell Identity (NCI).
      properties:
        id:
          type: string
          readOnly: true
          description: |
            NR Cell Global Identity of the cell, and its id in the API path: the MCC and MNC,
            `-`, then the NCI. Derived from `plmn` and `nci`.
          example: "99950-000000210"
        name:
          type: string
          description: Human-readable name of the cell
          example: cell-001
        plmn:
          $ref: "#/components/schemas/TepPlmnId"
          description: PLMN the cell belongs to
        nci:
          type: string
          pattern: "^[0-9A-Fa-f]{9}$"
          description: |
            NR Cell Identity (36 bits) in nine hex digits, as 3GPP's NrCellId (TS 29.571).
            Answered in lowercase.
          example: "000000210"
        center:
          $ref: "#/components/schemas/TepGeoPoint"
          description: Centre of the cell's coverage area
        radius:
          type: number
          format: double
          minimum: 0
          description: Coverage radius in metres
          example: 500
      required:
      - plmn
      - nci
      - center
      - radius
    TepPlmnId:
      type: object
      description: Identity of a Public Land Mobile Network
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
          description: Mobile Country Code
          example: "999"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
          description: Mobile Network Code
          example: "50"
      required:
      - mcc
      - mnc
    TepGeoPoint:
      type: object
      description: A point on the Earth's surface, in WGS84 decimal degrees
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude
          example: 37.9838
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude
          example: 23.7275
      required:
      - lat
      - lon
    TepSubscriberLocation:
      type: object
      description: |
        Where a subscriber's UE last reported from: the cell the core has it in, and that
        cell's coverage area, a circle around `center` of the given `radius`. The coverage
        area is only known for a cell registered with TEP: without `center` and `radius`,
        the cell isn't registered yet.
      properties:
        cellId:
          type: string
          description: |
            NR Cell Global Identity of the cell, as the core reports it: the `id` of the cell
            in TEP, whether it is registered or not.
          example: "99950-000000210"
        center:
          $ref: "#/components/schemas/TepGeoPoint"
          description: Centre of the cell's coverage area, if the cell is registered
        radius:
          type: number
          format: double
          minimum: 0
          description: Coverage radius in metres, if the cell is registered
          example: 500
        lastUpdated:
          type: string
          format: date-time
          description: When the UE last reported its location to the core
          example: "2026-11-05T09:40:42Z"
      required:
      - cellId
    TepSwaps:
      type: object
      description: |
        A subscriber's current SIM (IMSI) and device (IMEISV), and when each last
        changed: its latest SIM swap and device swap. Used to detect SIM swaps and
        device swaps. Values are reported by the core as-is.
      properties:
        phoneNumber:
          type: string
          description: Phone number (MSISDN) of the subscriber
          example: "+306999999999"
        imsi:
          type: string
          description: International Mobile Subscriber Identity of the SIM the phone number is on now
          example: "123456789012345"
        latestSimChange:
          type: string
          format: date-time
          description: When the IMSI for the phone number last changed, its latest SIM swap
        imeisv:
          type: string
          description: IMEI Software Version of the device in use now
          example: "3534900612345601"
        latestDeviceChange:
          type: string
          format: date-time
          description: When the IMEISV last changed, its latest device swap
    TepSubscriberRef:
      type: object
      description: TEP Subscriber Reference
      properties:
        id:
          type: string
          description: Subscriber id, and its id in the API path
          example: 6731f0c2a4b5c6d7e8f90123
        imsi:
          type: string
          description: International Mobile Subscriber Identity
          example: "123456789012345"
        phoneNumber:
          type: string
          description: Phone Number
          example: "+306999999999"
      required:
      - id
      - imsi
      - phoneNumber
    TepSubscriberStatus:
      type: object
      description: |
        What the 5G core knows of the subscriber's UE right now: whether it is registered
        and connected, the network serving it, and its PDU sessions.
      properties:
        connectionState:
          type: string
          description: |
            DEREGISTERED when the UE isn't registered with the core. Otherwise its
            connection management state: CONNECTED while it has a signalling connection
            with the core, IDLE when it hasn't.
          enum:
          - CONNECTED
          - IDLE
          - DEREGISTERED
          example: CONNECTED
        mcc:
          type: string
          description: Mobile Country Code of the network serving the UE
          example: "999"
        mnc:
          type: string
          description: Mobile Network Code of the network serving the UE
          example: "50"
        roaming:
          type: boolean
          description: |
            Whether the UE is roaming: the network serving it (`mcc`, `mnc`) isn't one of
            the home networks the deployment is configured with. Absent when that can't be
            told: the core doesn't report the serving network (e.g. the UE is
            `DEREGISTERED`), or no home networks are configured.
          example: false
        pduSessions:
          type: array
          description: The UE's PDU sessions, each a connection to a data network
          items:
            $ref: "#/components/schemas/TepSubscriberStatusPduSession"
      required:
      - connectionState
    TepSubscriberStatusPduSession:
      type: object
      description: A PDU session of the UE, its connection to a data network
      properties:
        pduSessionId:
          type: string
          description: Identifier of the PDU session within the UE
          example: "1"
        dnn:
          type: string
          description: Data Network Name of the data network it connects to
          example: internet
        sst:
          type: string
          description: Slice/Service Type of the network slice it is in
          example: "1"
        sd:
          type: string
          description: |
            Slice Differentiator of the network slice it is in. Absent for a slice
            without one.
          example: "000001"
        pduAddress:
          type: string
          description: |
            IP address the session gives the UE: the ueIpv4Addr of an AS session with QoS
            for it
          example: 10.45.0.9
        qosFlows:
          type: array
          description: The session's QoS flows, its default one and one for each QoS it was given
          items:
            $ref: "#/components/schemas/TepSubscriberStatusQosFlow"
    TepSubscriberStatusQosFlow:
      type: object
      description: A QoS flow of a PDU session
      properties:
        qfi:
          type: integer
          format: int32
          minimum: 0
          maximum: 63
          description: QoS Flow Identifier, within the session
          example: 1
        fiveQi:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          description: 5QI of the flow
          example: 9
      required:
      - qfi
      - fiveQi
