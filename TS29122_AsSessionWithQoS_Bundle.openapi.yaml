# TS29122_AsSessionWithQoS.yaml, made self-contained: the components it uses from
#   TS29122_CommonData.yaml
#   TS29512_Npcf_SMPolicyControl.yaml
#   TS29514_Npcf_PolicyAuthorization.yaml
#   TS29571_CommonData.yaml
# are copied in under their 3GPP names. The content of the 3GPP spec itself is unchanged, except
# that its references to those files now name this file; references inside the copied components
# are local. Where two of those files define the same name differently, each copy is prefixed with
# its spec number:
#   TS29122_DurationSec
#   TS29122_DurationSecRm
#   TS29122_Ipv4Addr
#   TS29122_Ipv6Addr
#   TS29571_DurationSec
#   TS29571_DurationSecRm
#   TS29571_Ipv4Addr
#   TS29571_Ipv6Addr

openapi: 3.0.0
info:
  title: 3gpp-as-session-with-qos
  version: 1.2.2
  description: |
    API for setting us an AS session with required QoS.  
    © 2022, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  
    All rights reserved.
externalDocs:
  description: 3GPP TS 29.122 V17.8.0 T8 reference point for Northbound APIs
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.122/
security:
  - {}
  - oAuth2ClientCredentials: []
servers:
  - url: "{apiRoot}/3gpp-as-session-with-qos/v1"
    variables:
      apiRoot:
        default: https://example.com
        description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122.
paths:
  /{scsAsId}/subscriptions:
    get:
      summary: Read all or queried active subscriptions for the SCS/AS.
      operationId: FetchAllASSessionWithQoSSubscriptions
      tags:
        - AS Session with Required QoS Subscriptions
      parameters:
        - name: scsAsId
          in: path
          description: Identifier of the SCS/AS
          required: true
          schema:
            type: string
        - name: ip-addrs
          in: query
          description: The IP address(es) of the requested UE(s).
          required: false
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/IpAddr
                minItems: 1
        - name: ip-domain
          in: query
          description: The IPv4 address domain identifier. The attribute may only be provided if IPv4 address is included in the ip-addrs query parameter.
          required: false
          schema:
            type: string
        - name: mac-addrs
          in: query
          description: The MAC address(es) of the requested UE(s).
          required: false
          schema:
            type: array
            items:
              $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/MacAddr48
            minItems: 1
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AsSessionWithQoSSubscription"
        "307":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
        "308":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "406":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/406
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
    post:
      summary: Creates a new subscription resource.
      operationId: CreateASSessionWithQoSSubscription
      tags:
        - AS Session with Required QoS Subscriptions
      parameters:
        - name: scsAsId
          in: path
          description: Identifier of the SCS/AS
          required: true
          schema:
            type: string
      requestBody:
        description: Request to create a new subscription resource
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsSessionWithQoSSubscription"
      callbacks:
        notificationDestination:
          "{request.body#/notificationDestination}":
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/UserPlaneNotificationData"
              responses:
                "204":
                  description: No Content (successful notification)
                "307":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
                "308":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
                "400":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
                "401":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
                "403":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
                "404":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
                "411":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/411
                "413":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/413
                "415":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/415
                "429":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
                "500":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
                "503":
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
                default:
                  $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
      responses:
        "201":
          description: Created (Successful creation of subscription)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsSessionWithQoSSubscription"
          headers:
            Location:
              description: Contains the URI of the newly created resource
              required: true
              schema:
                type: string
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "411":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/411
        "413":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/413
        "415":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/415
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
  /{scsAsId}/subscriptions/{subscriptionId}:
    get:
      summary: Read an active subscriptions for the SCS/AS and the subscription Id.
      operationId: FetchIndASSessionWithQoSSubscription
      tags:
        - Individual AS Session with Required QoS Subscription
      parameters:
        - name: scsAsId
          in: path
          description: Identifier of the SCS/AS
          required: true
          schema:
            type: string
        - name: subscriptionId
          in: path
          description: Identifier of the subscription resource
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK (Successful get the active subscription)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsSessionWithQoSSubscription"
        "307":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
        "308":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "406":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/406
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
    put:
      summary: Updates/replaces an existing subscription resource.
      operationId: UpdateIndASSessionWithQoSSubscription
      tags:
        - Individual AS Session with Required QoS Subscription
      parameters:
        - name: scsAsId
          in: path
          description: Identifier of the SCS/AS
          required: true
          schema:
            type: string
        - name: subscriptionId
          in: path
          description: Identifier of the subscription resource
          required: true
          schema:
            type: string
      requestBody:
        description: Parameters to update/replace the existing subscription
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsSessionWithQoSSubscription"
      responses:
        "200":
          description: OK (Successful update of the subscription)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsSessionWithQoSSubscription"
        "204":
          description: No Content (Successful update of the subscription)
        "307":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
        "308":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "411":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/411
        "413":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/413
        "415":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/415
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
    patch:
      summary: Updates/replaces an existing subscription resource.
      operationId: ModifyIndASSessionWithQoSSubscription
      tags:
        - Individual AS Session with Required QoS Subscription
      parameters:
        - name: scsAsId
          in: path
          description: Identifier of the SCS/AS
          required: true
          schema:
            type: string
        - name: subscriptionId
          in: path
          description: Identifier of the subscription resource
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AsSessionWithQoSSubscriptionPatch"
      responses:
        "200":
          description: OK. The subscription was modified successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsSessionWithQoSSubscription"
        "204":
          description: No Content. The subscription was modified successfully.
        "307":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
        "308":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "411":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/411
        "413":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/413
        "415":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/415
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
    delete:
      summary: Deletes an already existing subscription.
      operationId: DeleteIndASSessionWithQoSSubscription
      tags:
        - Individual AS Session with Required QoS Subscription
      parameters:
        - name: scsAsId
          in: path
          description: Identifier of the SCS/AS
          required: true
          schema:
            type: string
        - name: subscriptionId
          in: path
          description: Identifier of the subscription resource
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content (Successful deletion of the existing subscription)
        "200":
          description: OK (Successful deletion of the existing subscription)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPlaneNotificationData"
        "307":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
        "308":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
  /notifications:
    post:
      summary: notify bearer level event(s) from the SCEF to the SCS/AS
      tags:
        - AsSessionWithQoS API subscription events notification callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPlaneNotificationData"
      responses:
        "204":
          description: No Content (successful notification)
        "307":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/307
        "308":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/308
        "400":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/400
        "401":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/401
        "403":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/403
        "404":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/404
        "411":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/411
        "413":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/413
        "415":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/415
        "429":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/429
        "500":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/500
        "503":
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/503
        default:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/responses/default
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "{tokenUrl}"
          scopes: {}
  schemas:
    AsSessionWithQoSSubscription:
      description: Represents an individual AS session with required QoS subscription resource.
      type: object
      properties:
        self:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Link
        supportedFeatures:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/SupportedFeatures
        dnn:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Dnn
        snssai:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Snssai
        notificationDestination:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Link
        exterAppId:
          type: string
          description: Identifies the external Application Identifier.
        flowInfo:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/FlowInfo
          minItems: 1
          description: Describe the data flow which requires QoS.
        ethFlowInfo:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/EthFlowDescription
          minItems: 1
          description: Identifies Ethernet packet flows.
        enEthFlowInfo:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/EthFlowInfo
          minItems: 1
          description: |
            Identifies the Ethernet flows which require QoS. Each Ethernet flow consists of a flow idenifer and the corresponding UL and/or DL flows.
        qosReference:
          type: string
          description: Identifies a pre-defined QoS information
        altQoSReferences:
          type: array
          items:
            type: string
          minItems: 1
          description: Identifies an ordered list of pre-defined QoS information. The lower the index of the array for a given entry, the higher the priority.
        altQosReqs:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/AlternativeServiceRequirementsData
          minItems: 1
          description: Identifies an ordered list of alternative service requirements that include individual QoS parameter sets. The lower the index of the array for a given entry, the higher the priority.
        disUeNotif:
          description: |
            Indicates whether the QoS flow parameters signalling to the UE when the SMF is notified by the NG-RAN of changes in the fulfilled QoS situation is disabled (true) or not (false). Default value is false. The fulfilled situation is either the QoS profile or an Alternative QoS Profile.
          type: boolean
        ueIpv4Addr:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TS29122_Ipv4Addr
        ipDomain:
          type: string
        ueIpv6Addr:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TS29122_Ipv6Addr
        macAddr:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/MacAddr48
        usageThreshold:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/UsageThreshold
        sponsorInfo:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/SponsorInformation
        qosMonInfo:
          $ref: "#/components/schemas/QosMonitoringInformation"
        directNotifInd:
          type: boolean
          description: |
            Indicates whether the direct event notification is requested (true) or not (false). Default value is false.
        tscQosReq:
          $ref: "#/components/schemas/TscQosRequirement"
        requestTestNotification:
          type: boolean
          description: Set to true by the SCS/AS to request the SCEF to send a test notification as defined in clause 5.2.5.3. Set to false or omitted otherwise.
        websockNotifConfig:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/WebsockNotifConfig
        events:
          description: Represents the list of user plane event(s) to which the SCS/AS requests to subscribe to.
          type: array
          items:
            $ref: "#/components/schemas/UserPlaneEvent"
          minItems: 1
      required:
        - notificationDestination
    AsSessionWithQoSSubscriptionPatch:
      description: Represents parameters to modify an AS session with specific QoS subscription.
      type: object
      properties:
        exterAppId:
          type: string
          description: Identifies the external Application Identifier.
        flowInfo:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/FlowInfo
          minItems: 1
          description: Describe the IP data flow which requires QoS.
        ethFlowInfo:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/EthFlowDescription
          minItems: 1
          description: Identifies Ethernet packet flows.
        enEthFlowInfo:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/EthFlowInfo
          minItems: 1
          description: |
            Identifies the Ethernet flows which require QoS. Each Ethernet flow consists of a flow idenifer and the corresponding UL and/or DL flows.
        qosReference:
          type: string
          description: Pre-defined QoS reference
        altQoSReferences:
          type: array
          items:
            type: string
          minItems: 1
          description: Identifies an ordered list of pre-defined QoS information. The lower the index of the array for a given entry, the higher the priority.
        altQosReqs:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/AlternativeServiceRequirementsData
          minItems: 1
          description: Identifies an ordered list of alternative service requirements that include individual QoS parameter sets. The lower the index of the array for a given entry, the higher the priority.
        disUeNotif:
          type: boolean
          description: |
            Indicates whether the QoS flow parameters signalling to the UE when the SMF is notified by the NG-RAN of changes in the fulfilled QoS situation is disabled (true) or not (false). The fulfilled situation is either the QoS profile or an Alternative QoS Profile.
        usageThreshold:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/UsageThresholdRm
        qosMonInfo:
          $ref: "#/components/schemas/QosMonitoringInformationRm"
        directNotifInd:
          type: boolean
          description: |
            Indicates whether the direct event notification is requested (true) or not (false).
        notificationDestination:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Link
        tscQosReq:
          $ref: "#/components/schemas/TscQosRequirementRm"
        events:
          description: Represents the updated list of user plane event(s) to which the SCS/AS requests to subscribe to.
          type: array
          items:
            $ref: "#/components/schemas/UserPlaneEvent"
          minItems: 1
    QosMonitoringInformation:
      description: Represents QoS monitoring information.
      type: object
      properties:
        reqQosMonParams:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/RequestedQosMonitoringParameter
          minItems: 1
        repFreqs:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/ReportingFrequency
          minItems: 1
        repThreshDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
        repThreshUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
        repThreshRp:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
        waitTime:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TS29571_DurationSec
        repPeriod:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TS29571_DurationSec
      required:
        - reqQosMonParams
        - repFreqs
    QosMonitoringInformationRm:
      description: Represents the same as the QosMonitoringInformation data type but with the nullable:true property.
      type: object
      properties:
        reqQosMonParams:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/RequestedQosMonitoringParameter
          minItems: 1
        repFreqs:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/ReportingFrequency
          minItems: 1
        repThreshDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/UintegerRm
        repThreshUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/UintegerRm
        repThreshRp:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/UintegerRm
        waitTime:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TS29571_DurationSecRm
        repPeriod:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TS29571_DurationSecRm
    QosMonitoringReport:
      description: Represents a QoS monitoring report.
      type: object
      properties:
        ulDelays:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
          minItems: 1
        dlDelays:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
          minItems: 1
        rtDelays:
          type: array
          items:
            $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
          minItems: 1
    UserPlaneNotificationData:
      description: Represents the parameters to be conveyed in a user plane event(s) notification.
      type: object
      properties:
        transaction:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Link
        eventReports:
          type: array
          items:
            $ref: "#/components/schemas/UserPlaneEventReport"
          minItems: 1
          description: Contains the reported event and applicable information
      required:
        - transaction
        - eventReports
    UserPlaneEventReport:
      description: Represents an event report for user plane.
      type: object
      properties:
        event:
          $ref: "#/components/schemas/UserPlaneEvent"
        accumulatedUsage:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/AccumulatedUsage
        flowIds:
          type: array
          items:
            type: integer
          minItems: 1
          description: |
            Identifies the affected flows that were sent during event subscription. It might be omitted when the reported event applies to all the flows sent during the subscription.
        appliedQosRef:
          type: string
          description: The currently applied QoS reference. Applicable for event QOS_NOT_GUARANTEED or SUCCESSFUL_RESOURCES_ALLOCATION.
        plmnId:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/PlmnIdNid
        qosMonReports:
          type: array
          items:
            $ref: "#/components/schemas/QosMonitoringReport"
          minItems: 1
          description: Contains the QoS Monitoring Reporting information
        ratType:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/RatType
      required:
        - event
    TscQosRequirement:
      description: Represents QoS requirements for time sensitive communication.
      type: object
      properties:
        reqGbrDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRate
        reqGbrUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRate
        reqMbrDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRate
        reqMbrUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRate
        maxTscBurstSize:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/ExtMaxDataBurstVol
        req5Gsdelay:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/PacketDelBudget
        priority:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TscPriorityLevel
        tscaiTimeDom:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/Uinteger
        tscaiInputDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TscaiInputContainer
        tscaiInputUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TscaiInputContainer
    TscQosRequirementRm:
      description: Represents the same as the TscQosRequirement data type but with the nullable:true property.
      type: object
      properties:
        reqGbrDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRateRm
        reqGbrUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRateRm
        reqMbrDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRateRm
        reqMbrUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/BitRateRm
        maxTscBurstSize:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/ExtMaxDataBurstVolRm
        req5Gsdelay:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/PacketDelBudgetRm
        priority:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TscPriorityLevelRm
        tscaiTimeDom:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/UintegerRm
        tscaiInputDl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TscaiInputContainer
        tscaiInputUl:
          $ref: TS29122_AsSessionWithQoS_Bundle.openapi.yaml#/components/schemas/TscaiInputContainer
    UserPlaneEvent:
      anyOf:
        - type: string
          enum:
            - SESSION_TERMINATION
            - LOSS_OF_BEARER
            - RECOVERY_OF_BEARER
            - RELEASE_OF_BEARER
            - USAGE_REPORT
            - FAILED_RESOURCES_ALLOCATION
            - QOS_GUARANTEED
            - QOS_NOT_GUARANTEED
            - QOS_MONITORING
            - SUCCESSFUL_RESOURCES_ALLOCATION
            - ACCESS_TYPE_CHANGE
            - PLMN_CHG
        - type: string
          description: |
            This string provides forward-compatibility with future extensions to the enumeration but is not used to encode content defined in the present version of this API.
      description: |
        Possible values are - SESSION_TERMINATION: Indicates that Rx session is terminated. - LOSS_OF_BEARER : Indicates a loss of a bearer. - RECOVERY_OF_BEARER: Indicates a recovery of a bearer. - RELEASE_OF_BEARER: Indicates a release of a bearer. - USAGE_REPORT: Indicates the usage report event. - FAILED_RESOURCES_ALLOCATION: Indicates the resource allocation is failed. - QOS_GUARANTEED: The QoS targets of one or more SDFs are guaranteed again. - QOS_NOT_GUARANTEED: The QoS targets of one or more SDFs are not being guaranteed. - QOS_MONITORING: Indicates a QoS monitoring event. - SUCCESSFUL_RESOURCES_ALLOCATION: Indicates the resource allocation is successful. - ACCESS_TYPE_CHANGE: Indicates an Access type change. - PLMN_CHG: Indicates a PLMN change.
    AccumulatedUsage:
      description: Represents an accumulated usage.
      type: object
      properties:
        duration:
          $ref: "#/components/schemas/TS29122_DurationSec"
        totalVolume:
          $ref: "#/components/schemas/Volume"
        downlinkVolume:
          $ref: "#/components/schemas/Volume"
        uplinkVolume:
          $ref: "#/components/schemas/Volume"
    AlternativeServiceRequirementsData:
      description: Contains an alternative QoS related parameter set.
      type: object
      required:
        - altQosParamSetRef
      properties:
        altQosParamSetRef:
          type: string
          description: Reference to this alternative QoS related parameter set.
        gbrUl:
          $ref: "#/components/schemas/BitRate"
        gbrDl:
          $ref: "#/components/schemas/BitRate"
        pdb:
          $ref: "#/components/schemas/PacketDelBudget"
    BitRate:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      description: |
        String representing a bit rate; the prefixes follow the standard symbols from The International System of Units, and represent x1000 multipliers, with the exception that prefix "K" is used to represent the standard symbol "k".
    BitRateRm:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      nullable: true
      description: |
        This data type is defined in the same way as the 'BitRate' data type, but with the OpenAPI 'nullable: true' property.
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    Dnn:
      type: string
      description: |
        String representing a Data Network as defined in clause 9A of 3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full DNN with both the Network  Identifier and Operator Identifier, as specified in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which the labels are separated by dots  (e.g. "Label1.Label2.Label3").
    EthFlowDescription:
      description: Identifies an Ethernet flow.
      type: object
      required:
        - ethType
      properties:
        destMacAddr:
          $ref: "#/components/schemas/MacAddr48"
        ethType:
          type: string
        fDesc:
          $ref: "#/components/schemas/FlowDescription"
        fDir:
          $ref: "#/components/schemas/FlowDirection"
        sourceMacAddr:
          $ref: "#/components/schemas/MacAddr48"
        vlanTags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 2
        srcMacAddrEnd:
          $ref: "#/components/schemas/MacAddr48"
        destMacAddrEnd:
          $ref: "#/components/schemas/MacAddr48"
    EthFlowInfo:
      description: Represents Ethernet flow information.
      type: object
      properties:
        flowId:
          type: integer
          description: Indicates the Ethernet flow identifier.
        ethFlowDescriptions:
          type: array
          items:
            $ref: "#/components/schemas/EthFlowDescription"
          description: |
            Indicates the packet filters of the Ethernet flow. It shall contain UL and/or DL Ethernet flow description.
          minItems: 1
          maxItems: 2
      required:
        - flowId
    ExtMaxDataBurstVol:
      type: integer
      minimum: 4096
      maximum: 2000000
      description: |
        Unsigned integer indicating Maximum Data Burst Volume (see clauses 5.7.3.7 and 5.7.4 of 3GPP TS 23.501), expressed in Bytes. 
    ExtMaxDataBurstVolRm:
      type: integer
      minimum: 4096
      maximum: 2000000
      nullable: true
      description: |
        This data type is defined in the same way as the 'ExtMaxDataBurstVol' data type, but with the OpenAPI 'nullable: true' property.
    FlowDescription:
      description: Defines a packet filter of an IP flow.
      type: string
    FlowDirection:
      enum:
        - DOWNLINK
        - UPLINK
        - BIDIRECTIONAL
        - UNSPECIFIED
    FlowInfo:
      description: Represents IP flow information.
      type: object
      properties:
        flowId:
          type: integer
          description: Indicates the IP flow identifier.
        flowDescriptions:
          type: array
          items:
            type: string
          description: |
            Indicates the packet filters of the IP flow. Refer to clause 5.3.8 of 3GPP TS 29.214 for encoding. It shall contain UL and/or DL IP flow description.
          minItems: 1
          maxItems: 2
      required:
        - flowId
    InvalidParam:
      description: Represents the description of invalid parameters, for a request rejected due to invalid parameters.
      type: object
      properties:
        param:
          type: string
          description: Attribute's name encoded as a JSON Pointer, or header's name.
        reason:
          type: string
          description: A human-readable reason, e.g. "must be a positive integer".
      required:
        - param
    IpAddr:
      description: Contains an IP adresse.
      type: object
      oneOf:
        - required:
            - ipv4Addr
        - required:
            - ipv6Addr
        - required:
            - ipv6Prefix
      properties:
        ipv4Addr:
          $ref: "#/components/schemas/TS29571_Ipv4Addr"
        ipv6Addr:
          $ref: "#/components/schemas/TS29571_Ipv6Addr"
        ipv6Prefix:
          $ref: "#/components/schemas/Ipv6Prefix"
    Ipv6Prefix:
      type: string
      example: 2001:db8:abcd:12::0/64
      description: |
        String identifying an IPv6 address prefix formatted according to clause 4 of RFC 5952. IPv6Prefix data type may contain an individual /128 IPv6 address.
    Link:
      type: string
      description: string formatted according to IETF RFC 3986 identifying a referenced resource.
    MacAddr48:
      type: string
      pattern: ^([0-9a-fA-F]{2})((-[0-9a-fA-F]{2}){5})$
      description: |
        String identifying a MAC address formatted in the hexadecimal notation according to clause 1.1 and clause 2.1 of RFC 7042.
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: |
        Mobile Country Code part of the PLMN, comprising 3 digits, as defined in clause 9.3.3.5 of 3GPP TS 38.413. 
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits, as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: |
        This represents the Network Identifier, which together with a PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501 clause 5.30.2.1). 
    PacketDelBudget:
      type: integer
      minimum: 1
      description: |
        Unsigned integer indicating Packet Delay Budget (see clauses 5.7.3.4 and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.
    PacketDelBudgetRm:
      type: integer
      minimum: 1
      nullable: true
      description: |
        This data type is defined in the same way as the 'PacketDelBudget' data type, but with the OpenAPI 'nullable: true' property.
    PlmnIdNid:
      description: |
        Contains the serving core network operator PLMN ID and, for an SNPN, the NID that together with the PLMN ID identifies the SNPN.
      type: object
      required:
        - mcc
        - mnc
      properties:
        mcc:
          $ref: "#/components/schemas/Mcc"
        mnc:
          $ref: "#/components/schemas/Mnc"
        nid:
          $ref: "#/components/schemas/Nid"
    ProblemDetails:
      description: Represents additional information and details on an error response.
      type: object
      properties:
        type:
          $ref: "#/components/schemas/Uri"
        title:
          type: string
          description: A short, human-readable summary of the problem type. It should not change from occurrence to occurrence of the problem.
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          $ref: "#/components/schemas/Uri"
        cause:
          type: string
          description: A machine-readable application error cause specific to this occurrence of the problem. This IE should be present and provide application-related error information, if available.
        invalidParams:
          type: array
          items:
            $ref: "#/components/schemas/InvalidParam"
          minItems: 1
          description: Description of invalid parameters, for a request rejected due to invalid parameters.
        supportedFeatures:
          $ref: "#/components/schemas/SupportedFeatures"
    RatType:
      enum:
        - NR
        - EUTRA
        - WLAN
        - VIRTUAL
        - NBIOT
        - WIRELINE
        - WIRELINE_CABLE
        - WIRELINE_BBF
        - LTE-M
        - NR_U
        - EUTRA_U
        - TRUSTED_N3GA
        - TRUSTED_WLAN
        - UTRA
        - GERA
        - NR_LEO
        - NR_MEO
        - NR_GEO
        - NR_OTHER_SAT
        - NR_REDCAP
    ReportingFrequency:
      enum:
        - EVENT_TRIGGERED
        - PERIODIC
        - SESSION_RELEASE
    RequestedQosMonitoringParameter:
      enum:
        - DOWNLINK
        - UPLINK
        - ROUND_TRIP
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: |
            Unsigned integer, within the range 0 to 255, representing the Slice/Service Type.  It indicates the expected Network Slice behaviour in terms of features and services. Values 0 to 127 correspond to the standardized SST range. Values 128 to 255 correspond  to the Operator-specific range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are defined in clause 5.15.2.2 of 3GPP TS 23.501. 
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: |
            3-octet string, representing the Slice Differentiator, in hexadecimal representation. Each character in the string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits. The most significant character representing the 4 most significant bits of the SD shall appear first in the string, and the character representing the 4 least significant bit of the SD shall appear last in the string. This is an optional parameter that complements the Slice/Service type(s) to allow to  differentiate amongst multiple Network Slices of the same Slice/Service type. This IE shall be absent if no SD value is associated with the SST.
      description: |
        When Snssai needs to be converted to string (e.g. when used in maps as key), the string shall be composed of one to three digits "sst" optionally followed by "-" and 6 hexadecimal digits "sd".
      required:
        - sst
    SponsorInformation:
      description: Represents a sponsor information.
      type: object
      properties:
        sponsorId:
          type: string
          description: It indicates Sponsor ID.
        aspId:
          type: string
          description: It indicates Application Service Provider ID.
      required:
        - sponsorId
        - aspId
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: |
        A string used to indicate the features supported by an API that is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain a bitmask indicating supported features in  hexadecimal representation Each character in the string shall take a value of "0" to "9",  "a" to "f" or "A" to "F" and shall represent the support of 4 features as described in  table 5.2.2-3. The most significant character representing the highest-numbered features shall  appear first in the string, and the character representing features 1 to 4 shall appear last  in the string. The list of features and their numbering (starting with 1) are defined  separately for each API. If the string contains a lower number of characters than there are  defined features for an API, all features that would be represented by characters that are not  present in the string are not supported.
    TS29122_DurationSec:
      type: integer
      minimum: 0
      description: Unsigned integer identifying a period of time in units of seconds.
    TS29122_DurationSecRm:
      type: integer
      minimum: 0
      description: Unsigned integer identifying a period of time in units of seconds with "nullable=true" property.
      nullable: true
    TS29122_Ipv4Addr:
      type: string
      description: string identifying a Ipv4 address formatted in the "dotted decimal" notation as defined in IETF RFC 1166.
    TS29122_Ipv6Addr:
      type: string
      description: string identifying a Ipv6 address formatted according to clause 4 in IETF RFC 5952. The mixed Ipv4 Ipv6 notation according to clause 5 of IETF RFC 5952 shall not be used.
    TS29571_DurationSec:
      type: integer
      description: indicating a time in seconds.
    TS29571_DurationSecRm:
      type: integer
      nullable: true
      description: "indicating a time in seconds with OpenAPI defined 'nullable: true' property."
    TS29571_Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: |
        String identifying a IPv4 address formatted in the 'dotted decimal' notation as defined in RFC 1166.
    TS29571_Ipv6Addr:
      type: string
      example: 2001:db8:85a3::8a2e:370:7334
      description: |
        String identifying an IPv6 address formatted according to clause 4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952 shall not be used.
    TscPriorityLevel:
      description: Represents the priority level of TSC Flows.
      type: integer
      minimum: 1
      maximum: 8
    TscPriorityLevelRm:
      description: This data type is defined in the same way as the TscPriorityLevel data type, but with the OpenAPI nullable property set to true.
      type: integer
      minimum: 1
      maximum: 8
      nullable: true
    TscaiInputContainer:
      description: Indicates TSC Traffic pattern.
      type: object
      properties:
        periodicity:
          $ref: "#/components/schemas/Uinteger"
        burstArrivalTime:
          $ref: "#/components/schemas/DateTime"
        surTimeInNumMsg:
          $ref: "#/components/schemas/Uinteger"
        surTimeInTime:
          $ref: "#/components/schemas/Uinteger"
      nullable: true
    Uinteger:
      type: integer
      minimum: 0
      description: Unsigned Integer, i.e. only value 0 and integers above 0 are permissible.
    UintegerRm:
      type: integer
      minimum: 0
      description: |
        Unsigned Integer, i.e. only value 0 and integers above 0 are permissible with the OpenAPI 'nullable: true' property.
      nullable: true
    Uri:
      type: string
      description: string providing an URI formatted according to IETF RFC 3986.
    UsageThreshold:
      description: Represents a usage threshold.
      type: object
      properties:
        duration:
          $ref: "#/components/schemas/TS29122_DurationSec"
        totalVolume:
          $ref: "#/components/schemas/Volume"
        downlinkVolume:
          $ref: "#/components/schemas/Volume"
        uplinkVolume:
          $ref: "#/components/schemas/Volume"
    UsageThresholdRm:
      description: Represents the same as the UsageThreshold data type but with the nullable:true property.
      type: object
      properties:
        duration:
          $ref: "#/components/schemas/TS29122_DurationSecRm"
        totalVolume:
          $ref: "#/components/schemas/VolumeRm"
        downlinkVolume:
          $ref: "#/components/schemas/VolumeRm"
        uplinkVolume:
          $ref: "#/components/schemas/VolumeRm"
      nullable: true
    Volume:
      type: integer
      format: int64
      minimum: 0
      description: Unsigned integer identifying a volume in units of bytes.
    VolumeRm:
      type: integer
      format: int64
      minimum: 0
      description: Unsigned integer identifying a volume in units of bytes with "nullable=true" property.
      nullable: true
    WebsockNotifConfig:
      description: Represents the configuration information for the delivery of notifications over Websockets.
      type: object
      properties:
        websocketUri:
          $ref: "#/components/schemas/Link"
        requestWebsocketUri:
          type: boolean
          description: Set by the SCS/AS to indicate that the Websocket delivery is requested.
  responses:
    "307":
      description: Temporary Redirect
      headers:
        Location:
          description: An alternative URI of the resource.
          required: true
          schema:
            type: string
    "308":
      description: Permanent Redirect
      headers:
        Location:
          description: An alternative URI of the resource.
          required: true
          schema:
            type: string
    "400":
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "401":
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "403":
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "404":
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "406":
      description: Not Acceptable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "411":
      description: Length Required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "413":
      description: Payload Too Large
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "415":
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    "429":
      description: Too Many Requests
      content:
